[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carekin-backend"
version = "0.1.0"
description = "CareKin FastAPI service — care marketplace, safety layer and facility directory for people living with sickle cell disease."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",  # NoDecode in config.py needs 2.7
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "geoalchemy2>=0.15",
    "alembic>=1.16",  # path_separator in alembic.ini needs 1.16
    "PyJWT>=2.8",  # access tokens (python-jose is unmaintained)
    "cryptography>=42",
    "httpx>=0.27",
    "celery>=5.4",
    "redis>=5.0",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.26",  # asyncio_default_test_loop_scope
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*", "seed*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
# One event loop for the whole run, so the shared engine and Redis client stay valid.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
