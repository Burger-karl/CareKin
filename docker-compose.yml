services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: carekin
      POSTGRES_PASSWORD: carekin
      POSTGRES_DB: carekin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/code

volumes:
  pgdata:
