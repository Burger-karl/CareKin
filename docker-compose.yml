services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: carekin
      POSTGRES_PASSWORD: carekin
      POSTGRES_DB: carekin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carekin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local LLM for the AI agents (Days 14-15). Models are stored in the
  # ollama_data volume, so they're downloaded once, not on every start.
  ollama:
    image: ollama/ollama:0.40.2
    ports:
      # 127.0.0.1: reachable from this machine only; the API has no auth.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: pulls OLLAMA_MODEL into the volume, then exits. A no-op once the
  # model is there. The first pull downloads about 2 GB.
  ollama-pull:
    image: ollama/ollama:0.40.2
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-llama3.2:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Services reach each other by name inside Docker; .env keeps localhost.
      OLLAMA_URL: http://ollama:11434
    # Apply migrations, then start the API with reload for local development.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Started, not healthy or pulled: the API works without the LLM (agents
      # fall back to replies built without it).
      ollama:
        condition: service_started
    volumes:
      - ./backend:/code

  # Celery: background jobs. Beat runs crisis.sweep_alerts every 30 s to retry
  # crisis SMS that failed. Crisis alerts are first sent by the API itself, so the
  # button still works if these two are down; they only add the retries.
  worker:
    build: ./backend
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434  # the companion's WhatsApp replies run here
    command: celery -A app.worker worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/code

  beat:
    build: ./backend
    env_file: .env
    command: celery -A app.worker beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/code

volumes:
  pgdata:
  ollama_data:
